<style>
    .pregnancy-calculator {
        max-width: 760px;
        margin: 0 auto;
        padding: 30px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        box-sizing: border-box;
    }

    .pregnancy-calculator h2 {
        margin: 0 0 10px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--primary-color, #2b6cb0);
        color: var(--primary-color, #2b6cb0);
    }

    .pregnancy-description,
    .pregnancy-note {
        color: #4a5568;
        line-height: 1.65;
    }

    .pregnancy-methods {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 22px 0;
        padding: 0;
        border: 0;
    }

    .pregnancy-method {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 10px 14px;
        border: 1px solid #cbd5e0;
        border-radius: 8px;
        background: #f7fafc;
        cursor: pointer;
        box-sizing: border-box;
    }

    .pregnancy-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 20px;
    }

    .pregnancy-field label {
        display: block;
        margin-bottom: 7px;
        font-weight: 700;
    }

    .pregnancy-field input {
        width: 100%;
        min-height: 46px;
        padding: 9px 10px;
        border: 1px solid #cbd5e0;
        border-radius: 7px;
        background: #fff;
        color: #2d3748;
        font: inherit;
        box-sizing: border-box;
    }

    .pregnancy-calculate {
        width: 100%;
        min-height: 48px;
        font-size: 1.08rem;
        font-weight: 700;
    }

    .pregnancy-result {
        margin-top: 24px;
        padding: 22px;
        border: 1px solid #bee3f8;
        border-radius: 12px;
        background: #ebf8ff;
    }

    .pregnancy-result[hidden] {
        display: none;
    }

    .pregnancy-result.is-error {
        border-color: #feb2b2;
        background: #fff5f5;
        color: #9b2c2c;
    }

    .pregnancy-week {
        margin: 0 0 18px;
        text-align: center;
        font-size: 1.15rem;
    }

    .pregnancy-week strong {
        display: inline-block;
        margin: 0 4px;
        color: #1a365d;
        font-size: 2.2rem;
        line-height: 1;
    }

    .pregnancy-details {
        margin: 0;
        padding-left: 1.3em;
        line-height: 1.8;
    }

    .pregnancy-note {
        margin: 18px 0 0;
        padding-top: 14px;
        border-top: 1px solid #cbd5e0;
        font-size: .9rem;
    }

    @media (max-width: 600px) {
        .pregnancy-calculator {
            padding: 20px 16px;
        }

        .pregnancy-methods,
        .pregnancy-fields {
            grid-template-columns: 1fr;
        }
    }
</style>

<section class="tool-section pregnancy-calculator" id="pregnancy-calculator">
    <h2>孕週與預產期計算小幫手</h2>
    <p class="pregnancy-description">依最後一次月經日或預產期，計算指定日期當天的懷孕週數與天數。</p>

    <fieldset class="pregnancy-methods">
        <legend>計算方式</legend>
        <label class="pregnancy-method">
            <input type="radio" name="pregnancy-method" value="lmp" checked>
            已知最後一次月經日
        </label>
        <label class="pregnancy-method">
            <input type="radio" name="pregnancy-method" value="due">
            已知預產期
        </label>
    </fieldset>

    <div class="pregnancy-fields">
        <div class="pregnancy-field">
            <label for="pregnancy-input-date" id="pregnancy-input-label">最後一次月經日</label>
            <input type="date" id="pregnancy-input-date">
        </div>
        <div class="pregnancy-field">
            <label for="pregnancy-reference-date">計算基準日</label>
            <input type="date" id="pregnancy-reference-date">
        </div>
    </div>

    <button type="button" class="btn pregnancy-calculate" id="pregnancy-calculate-button">計算</button>
    <div class="pregnancy-result" id="pregnancy-result" role="status" aria-live="polite" hidden></div>
</section>
